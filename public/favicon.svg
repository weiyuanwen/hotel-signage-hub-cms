  <circle cx="32" cy="27" r="9" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
  <circle cx="32" cy="27" r="13" stroke="#06B6D4" stroke-width="1.5" opacity="0.4" />

  <!-- Chân đế màn hình TV -->
