      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Khung màn hình bo góc (Signage Screen) -->
  <rect x="6" y="8" width="52" height="38" rx="8" fill="url(#hubGrad)" />
  <rect x="10" y="12" width="44" height="30" rx="5" fill="#0F172A" />

  <!-- Nút tín hiệu & sóng kết nối (Hub / Broadcast) -->
